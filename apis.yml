name: Yoom (fka Tetavi)
description: 'Yoom (formerly Tetavi) is an Israeli deep-tech company founded in 2016
  that develops volumetric video and markerless performance-capture technology using
  proprietary AI and neural networks. Its products include YoomTrack, a studio-grade
  markerless motion-capture system that captures full-body, hand, and facial motion
  simultaneously, and the YOOM Volumetric plugin for Unreal Engine (distributed via
  Epic Games'' Fab marketplace) that plays back volumetric capture content in real
  time. Yoom serves gaming, film, TV, VFX, and immersive-media studios and is backed
  by Insight Partners. The company distributes its technology as game-engine plugins
  (Unreal Engine, Unity, Autodesk Maya, MotionBuilder) rather than as a public web
  API; as of this pass it publishes no REST/GraphQL API, developer portal, SDK on a
  public package registry, or OpenAPI specification.'
